services:
  app:
    image: ghcr.io/johndevss/au-srms:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: au-srms-app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/app
    environment:
      - SERVER_NAME=:80
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-au_srms}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
    depends_on:
      - mysql
    networks:
      - au-srms-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: au-srms-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_DATABASE=${DB_DATABASE:-au_srms}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/au-srms.sql:/docker-entrypoint-initdb.d/au-srms.sql
    networks:
      - au-srms-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  au-srms-network:
    driver: bridge
